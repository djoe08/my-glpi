# GLPI – stack Portainer (hôte debian13-docker, réseau Docker_Net)
# Les mots de passe sont fournis par les variables d'environnement du stack
# (Portainer → Stacks → Environment variables, ou "Load variables from .env file"
# avec stack.env.example rempli). Ne jamais les écrire en clair ici : le dépôt est public.

services:
  glpi-app:
    image: glpi/glpi:${GLPI_VERSION:-latest}
    container_name: GLPI
    restart: unless-stopped
    networks:
      - Docker_Net
    depends_on:
      glpi-db:
        condition: service_healthy
    ports:
      - ${GLPI_HTTP_PORT:-9461}:80
    environment:
      - GLPI_DB_HOST=glpi-db
      - GLPI_DB_PORT=3306
      - GLPI_DB_NAME=glpi
      - GLPI_DB_USER=glpi
      - GLPI_DB_PASSWORD=${GLPI_DB_PASSWORD:?GLPI_DB_PASSWORD manquant}
    volumes:
      - ${GLPI_DATA_DIR:-/volume2/docker/glpi}/data:/var/glpi

  glpi-db:
    image: mysql:8.4
    container_name: GLPI-DB
    restart: unless-stopped
    networks:
      - Docker_Net
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD manquant}
      - MYSQL_DATABASE=glpi
      - MYSQL_USER=glpi
      - MYSQL_PASSWORD=${GLPI_DB_PASSWORD:?GLPI_DB_PASSWORD manquant}
    healthcheck:
      # $$ : la variable est lue dans le conteneur, pas substituée par Compose
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - ${GLPI_DATA_DIR:-/volume2/docker/glpi}/db:/var/lib/mysql

networks:
  Docker_Net:
    external: true
